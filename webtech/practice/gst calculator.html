<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Gst Calculator</h2>
    <br>
    <input type="number" id="amount" placeholder="enter the amount">
    <br>
    <input type="number" id="gst amount" placeholder="enter the gst">
    <br>

    <button onclick="calculategst()"> calculate gst</button>

    <div id="result"></div>

    <script>
        function calculategst(){
            let amount= Number(document.getElementById("amount").value);
            let gst= Number(document.getElementById("gst amount").value);
             
            let totalgst= (amount*gst)/100;
            let totalamount= totalgst+amount;

            document.getElementById("result").innerHTML="gst amount: " +totalgst.toFixed(2) +
            
            "<br> total amount: " +totalamount.toFixed(3);
            
        }
    </script>

</body>
</html>
