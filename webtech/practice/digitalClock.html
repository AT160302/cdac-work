<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div id="clock" style="width:700px; background-color: aqua; font-size: 100px;"></div>
</body>

<script>
    function myclock() {
        let clock= new Date();

        document.getElementById("clock").innerHTML=clock.toLocaleTimeString();
        
    }
    setInterval(myclock,1000);
</script>
</html>
